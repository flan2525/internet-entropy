name: Official observation

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

concurrency:
  group: official-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify due URLs before observation
        env:
          PUBLIC_APP_URL: https://internet-entropy.pages.dev
          OBSERVATION_CRON_SECRET: ${{ secrets.OBSERVATION_CRON_SECRET }}
        run: npm run verify:urls --prefix .
      - name: Trigger fixed observation
        env:
          PUBLIC_APP_URL: https://internet-entropy.pages.dev
          OBSERVATION_CRON_SECRET: ${{ secrets.OBSERVATION_CRON_SECRET }}
          OBSERVATION_RUN_TYPE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual_official' }}
          OBSERVATION_PANEL_ID: en-us-core-v1
          OBSERVATION_RUN_KEY: ${{ github.run_id }}
        run: npm run observe:official --prefix .
      - name: Verify departed URLs after observation
        env:
          PUBLIC_APP_URL: https://internet-entropy.pages.dev
          OBSERVATION_CRON_SECRET: ${{ secrets.OBSERVATION_CRON_SECRET }}
        run: npm run verify:urls --prefix .
