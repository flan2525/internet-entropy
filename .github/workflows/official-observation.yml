name: Official observation

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Trigger fixed observation
        env:
          PUBLIC_APP_URL: https://internet-entropy.pages.dev
          OBSERVATION_CRON_SECRET: ${{ secrets.OBSERVATION_CRON_SECRET }}
          OBSERVATION_RUN_TYPE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual_official' }}
        run: npm run observe:official --prefix .
