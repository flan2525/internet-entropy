name: Brave one-query diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Inspect one Brave response
        env:
          PUBLIC_APP_URL: https://internet-entropy.pages.dev
          OBSERVATION_CRON_SECRET: ${{ secrets.OBSERVATION_CRON_SECRET }}
        run: node scripts/diagnose-brave.mjs
